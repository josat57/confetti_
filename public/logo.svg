<svg viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confetti logo">
  <title>Confetti — AI-Powered Event Planning</title>
  <defs>
    <!-- Gradient for the "C" in wordmark to echo the icon -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- ── Icon ─────────────────────────────────────────────── -->
  <polygon points="21,3 37,19 21,19" fill="#7c3aed"/>
  <polygon points="37,21 21,37 21,21" fill="#9333ea"/>
  <polygon points="19,37 3,21 19,21" fill="#ec4899"/>
  <polygon points="3,19 19,3 19,19" fill="#c084fc"/>
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.95"/>

  <!-- ── Wordmark ──────────────────────────────────────────── -->
  <!-- "C" in brand purple gradient, rest in near-black -->
  <text
    font-family="'Inter', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="-0.4">
    <tspan x="50" y="28" fill="url(#cGrad)">C</tspan><tspan fill="#111827">onfetti</tspan>
  </text>
</svg>
