<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confetti icon">
  <title>Confetti</title>
  <!--
    "The Confetti Prism"
    A diamond split into 4 burst-apart quadrants — the frozen moment
    confetti is thrown. Four pieces: plan · connect · manage · celebrate.
    The central gap is the AI spark — precision at the heart of celebration.
  -->

  <!-- Top-right quadrant — deep purple: trust, authority -->
  <polygon points="21,3 37,19 21,19" fill="#7c3aed"/>

  <!-- Bottom-right quadrant — vivid purple: energy, creativity -->
  <polygon points="37,21 21,37 21,21" fill="#9333ea"/>

  <!-- Bottom-left quadrant — pink: joy, celebration -->
  <polygon points="19,37 3,21 19,21" fill="#ec4899"/>

  <!-- Top-left quadrant — lavender: intelligence, AI -->
  <polygon points="3,19 19,3 19,19" fill="#c084fc"/>

  <!-- Central spark — AI precision core -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.95"/>
</svg>
