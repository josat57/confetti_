version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confetti-client
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://host.docker.internal:9601/api/v1}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - /app/node_modules
    restart: unless-stopped
    networks:
      - confetti-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Include backend service if needed (uncomment to use)
  # backend:
  #   image: your-backend-image:latest
  #   container_name: confetti-backend
  #   ports:
  #     - "9600:9600"
  #   environment:
  #     - DATABASE_URL=${DATABASE_URL}
  #     - JWT_SECRET=${JWT_SECRET}
  #   networks:
  #     - confetti-network
  #   restart: unless-stopped

networks:
  confetti-network:
    driver: bridge
